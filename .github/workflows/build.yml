name: Build Taptalk Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout whisper.cpp
        run: |
          git clone --depth 1 --branch v1.9.2 https://github.com/ggml-org/whisper.cpp.git whisper.cpp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build whisper.dll (AVX-512, static CRT)
        working-directory: native
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_OPENMP=OFF -DWHISPER_SRC_DIR="$env:GITHUB_WORKSPACE\whisper.cpp" -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_AVX512=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build build --target whisper

      - name: Restore + Build solution (Release x64)
        run: |
          dotnet restore Taptalk.sln
          dotnet publish Taptalk.WPF -c Release -r win-x64 --self-contained true -o publish

      - name: Copy whisper + ggml runtime DLLs into publish
        run: |
          Copy-Item "native\build\bin\Release\whisper.dll" "publish\whisper.dll" -Force
          Copy-Item "native\build\bin\ggml.dll" "publish\ggml.dll" -Force
          Copy-Item "native\build\bin\ggml-cpu.dll" "publish\ggml-cpu.dll" -Force
          Copy-Item "native\build\bin\ggml-base.dll" "publish\ggml-base.dll" -Force

      - name: Verify whisper.dll dependencies (dumpbin)
        run: |
          $db = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($db) {
            Write-Host "dumpbin: $db"
            & $db /dependents "publish\whisper.dll"
            Write-Host "--- whisper/ggml DLLs present in publish ---"
            Get-ChildItem publish -Filter "*.dll" | Where-Object { $_.Name -match "ggml|whisper" } | ForEach-Object { Write-Host $_.Name }
          } else {
            Write-Host "dumpbin not found - skipping dependency check"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        working-directory: installer
        run: |
          iscc /DAppDir="..\publish" Taptalk.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taptalk-Setup
          path: installer/Output/*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: installer/Output/*.exe
